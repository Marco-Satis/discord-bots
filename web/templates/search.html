{% extends "base_v5.html" %}

{% block title %}Suche{% endblock %}
{% block nav_search %}active{% endblock %}

{% block content %}
{# V6-Migration 2026-07-14: seiten-lokale `<style>`-Insel entfernt (Alt-Tokens
   --bg-primary/--border-color/--accent*/--radius-sm). Alle Search-Klassen kommen
   jetzt token-only aus v5_components.css. Filter-Pills -> .filter-bar + .btn btn-sm,
   .search-source-badge -> .badge badge-info. Backend/Query-Kontrakt unveraendert. #}
<div class="page-header">
    <h1>Suche</h1>
    <p class="page-subtitle">Volltextsuche ueber alle Dashboard-Daten</p>
</div>

<!-- Suchfeld -->
<div class="config-section">
    <form method="get" action="/search" class="search-form">
        <div class="search-input-group">
            <input type="text"
                   name="q"
                   value="{{ query }}"
                   placeholder="Suchbegriff eingeben..."
                   class="search-input"
                   autofocus
                   autocomplete="off">
            <button type="submit" class="btn btn-primary">Suchen</button>
        </div>
    </form>

    {% if recent_searches %}
    <div class="search-recent">
        <small class="text-muted">Letzte Suchen:</small>
        {% for term in recent_searches %}
        <a href="/search?q={{ term }}" class="search-tag">{{ term }}</a>
        {% endfor %}
    </div>
    {% endif %}
</div>

<!-- Ergebnisse -->
{% if query %}
<div class="config-section">
    <div class="section-header">
        <h3 class="section-title">Ergebnisse{% if total %} ({{ total }}){% endif %}</h3>
    </div>

    {% if total == 0 %}
    <p class="text-muted">Keine Ergebnisse fuer &laquo;{{ query }}&raquo; gefunden.</p>
    {% else %}
    <!-- Quell-Filter -->
    <div class="filter-bar">
        <a href="/search?q={{ query }}"
           class="btn btn-sm {% if not request.query_params.get('source') %}btn-primary{% else %}btn-secondary{% endif %}">Alle ({{ total }})</a>
        {% for source_key, group in grouped.items() %}
        <a href="/search?q={{ query }}&source={{ source_key }}"
           class="btn btn-sm {% if request.query_params.get('source') == source_key %}btn-primary{% else %}btn-secondary{% endif %}">{{ group.label }} ({{ group.items|length }})</a>
        {% endfor %}
    </div>

    <!-- Gruppierte Ergebnisse -->
    {% for source_key, group in grouped.items() %}
    <div class="search-group">
        <h4 class="search-group-title">{{ group.label }}</h4>
        {% for item in group.items %}
        <div class="search-result">
            <div class="search-result-content">{{ item.snippet|safe }}</div>
            <div class="search-result-meta">
                <span class="badge badge-info">{{ group.label }}</span>
                {% if item.timestamp %}
                <span class="text-muted">{{ item.timestamp }}</span>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
    {% endif %}
</div>
{% endif %}
{% endblock %}
