<!-- Analytics Tab Content — geladen via HTMX -->
<div class="analytics-container">
    <div class="analytics-controls">
        <div class="period-selector">
            <button class="btn-period active" data-period="24h" onclick="setPeriod('24h')">24h</button>
            <button class="btn-period" data-period="7d" onclick="setPeriod('7d')">7 Tage</button>
            <button class="btn-period" data-period="30d" onclick="setPeriod('30d')">30 Tage</button>
        </div>
        <div class="analytics-summary" id="analyticsSummary">
            <!-- Wird per JS befuellt -->
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-card">
            <h4>CPU &amp; RAM Auslastung</h4>
            <canvas id="perfChart" height="200"></canvas>
            <div class="chart-empty" id="perfChartEmpty" style="display:none;">
                Keine Daten fuer den gewaehlten Zeitraum vorhanden.
            </div>
        </div>
        <div class="chart-card">
            <h4>Spieler-Aktivitaet</h4>
            <canvas id="playerChart" height="200"></canvas>
            <div class="chart-empty" id="playerChartEmpty" style="display:none;">
                Keine Daten fuer den gewaehlten Zeitraum vorhanden.
            </div>
        </div>
        <div class="chart-card">
            <h4>Disk-Auslastung</h4>
            <canvas id="diskChart" height="200"></canvas>
            <div class="chart-empty" id="diskChartEmpty" style="display:none;">
                Keine Daten fuer den gewaehlten Zeitraum vorhanden.
            </div>
        </div>
        <div class="chart-card">
            <h4>Server-Uptime</h4>
            <canvas id="uptimeChart" height="200"></canvas>
            <div class="chart-empty" id="uptimeChartEmpty" style="display:none;">
                Keine Daten fuer den gewaehlten Zeitraum vorhanden.
            </div>
        </div>
    </div>
</div>

<style>
    /* --- Analytics-spezifische Styles --- */
    .analytics-container {
        padding: 0;
    }

    .analytics-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .period-selector {
        display: flex;
        gap: 0.5rem;
    }

    .btn-period {
        padding: 0.5rem 1.2rem;
        border: 1px solid var(--border-color, #2a2a4e);
        border-radius: var(--radius-sm, 4px);
        background: var(--bg-card, #0f3460);
        color: var(--text-primary, #e0e0e0);
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }

    .btn-period:hover {
        background: var(--bg-hover, #1e2a4a);
        border-color: var(--accent, #533483);
    }

    .btn-period.active {
        background: var(--accent, #533483);
        border-color: var(--accent-light, #6c44a0);
        color: #ffffff;
    }

    .analytics-summary {
        display: flex;
        gap: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-secondary, #a0a0b8);
    }

    .analytics-summary .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .analytics-summary .stat-value {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-primary, #e0e0e0);
    }

    .analytics-summary .stat-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .chart-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        gap: 1.5rem;
    }

    .chart-card {
        background: var(--bg-card, #0f3460);
        border-radius: var(--radius, 8px);
        padding: 1.2rem;
        box-shadow: var(--shadow, 0 2px 8px rgba(0, 0, 0, 0.3));
        position: relative;
    }

    .chart-card h4 {
        margin: 0 0 1rem 0;
        font-size: 1rem;
        color: var(--text-primary, #e0e0e0);
        font-weight: 500;
    }

    .chart-card canvas {
        width: 100% !important;
    }

    .chart-empty {
        text-align: center;
        color: var(--text-muted, #6c6c80);
        padding: 3rem 1rem;
        font-style: italic;
    }

    /* Responsive Anpassungen */
    @media (max-width: 768px) {
        .chart-grid {
            grid-template-columns: 1fr;
        }

        .analytics-controls {
            flex-direction: column;
            align-items: flex-start;
        }

        .analytics-summary {
            flex-wrap: wrap;
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
(function() {
    'use strict';

    // --- Farbkonfiguration (passend zum Dashboard-Theme) ---
    const COLORS = {
        cpu:      { border: '#e94560', bg: 'rgba(233, 69, 96, 0.15)' },
        ram:      { border: '#533483', bg: 'rgba(83, 52, 131, 0.15)' },
        disk:     { border: '#3498db', bg: 'rgba(52, 152, 219, 0.15)' },
        players:  { border: '#2ecc71', bg: 'rgba(46, 204, 113, 0.15)' },
        total:    { border: '#f39c12', bg: 'rgba(243, 156, 18, 0.15)' },
        uptime:   { border: '#2ecc71', bg: 'rgba(46, 204, 113, 0.3)' },
        downtime: { border: '#e74c3c', bg: 'rgba(231, 76, 60, 0.3)' },
        // Zusaetzliche Farben fuer mehrere Server
        extra: [
            { border: '#1abc9c', bg: 'rgba(26, 188, 156, 0.15)' },
            { border: '#9b59b6', bg: 'rgba(155, 89, 182, 0.15)' },
            { border: '#e67e22', bg: 'rgba(230, 126, 34, 0.15)' },
            { border: '#3498db', bg: 'rgba(52, 152, 219, 0.15)' },
        ],
    };

    // Gemeinsame Chart-Optionen (Dark Theme)
    const CHART_DEFAULTS = {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
            mode: 'index',
            intersect: false,
        },
        plugins: {
            legend: {
                labels: {
                    color: '#a0a0b8',
                    font: { size: 12 },
                    boxWidth: 12,
                    padding: 15,
                },
            },
            tooltip: {
                backgroundColor: 'rgba(15, 52, 96, 0.95)',
                titleColor: '#e0e0e0',
                bodyColor: '#a0a0b8',
                borderColor: '#2a2a4e',
                borderWidth: 1,
                cornerRadius: 6,
                padding: 10,
            },
        },
        scales: {
            x: {
                ticks: {
                    color: '#6c6c80',
                    font: { size: 10 },
                    maxTicksLimit: 12,
                    maxRotation: 45,
                },
                grid: { color: 'rgba(42, 42, 78, 0.5)' },
            },
            y: {
                ticks: {
                    color: '#6c6c80',
                    font: { size: 11 },
                },
                grid: { color: 'rgba(42, 42, 78, 0.5)' },
                beginAtZero: true,
            },
        },
    };

    // --- Aktueller Zeitraum ---
    let currentPeriod = '24h';

    // --- Chart-Instanzen ---
    let perfChart = null;
    let playerChart = null;
    let diskChart = null;
    let uptimeChart = null;

    // --- Hilfsfunktion: Chart erstellen oder aktualisieren ---
    function createOrUpdateChart(chartVar, canvasId, emptyId, config) {
        const canvas = document.getElementById(canvasId);
        const emptyDiv = document.getElementById(emptyId);

        if (!canvas) return null;

        // Leere-Daten-Hinweis verwalten
        const hasData = config.data.labels && config.data.labels.length > 0;
        if (emptyDiv) {
            emptyDiv.style.display = hasData ? 'none' : 'block';
        }
        canvas.style.display = hasData ? 'block' : 'none';

        if (!hasData) {
            if (chartVar) chartVar.destroy();
            return null;
        }

        if (chartVar) {
            chartVar.data = config.data;
            chartVar.update('none');
            return chartVar;
        }

        return new Chart(canvas.getContext('2d'), config);
    }

    // --- Performance-Chart (CPU & RAM) ---
    async function loadPerfChart() {
        try {
            const resp = await fetch('/api/analytics/system?period=' + currentPeriod);
            if (!resp.ok) return;
            const data = await resp.json();

            const config = {
                type: 'line',
                data: {
                    labels: data.labels || [],
                    datasets: [
                        {
                            label: 'CPU %',
                            data: data.datasets?.[0]?.data || [],
                            borderColor: COLORS.cpu.border,
                            backgroundColor: COLORS.cpu.bg,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                        {
                            label: 'RAM %',
                            data: data.datasets?.[1]?.data || [],
                            borderColor: COLORS.ram.border,
                            backgroundColor: COLORS.ram.bg,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                    ],
                },
                options: {
                    ...CHART_DEFAULTS,
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            max: 100,
                            ticks: {
                                ...CHART_DEFAULTS.scales.y.ticks,
                                callback: function(val) { return val + '%'; },
                            },
                        },
                    },
                },
            };

            perfChart = createOrUpdateChart(perfChart, 'perfChart', 'perfChartEmpty', config);
        } catch (err) {
            console.error('Fehler beim Laden der Performance-Daten:', err);
        }
    }

    // --- Spieler-Chart ---
    async function loadPlayerChart() {
        try {
            const resp = await fetch('/api/analytics/players?period=' + currentPeriod);
            if (!resp.ok) return;
            const data = await resp.json();

            const datasets = (data.datasets || []).map(function(ds, idx) {
                let color;
                if (ds.label === 'Gesamt') {
                    color = COLORS.total;
                } else if (idx === 0) {
                    color = COLORS.players;
                } else {
                    color = COLORS.extra[(idx - 1) % COLORS.extra.length];
                }

                return {
                    label: ds.label,
                    data: ds.data || [],
                    borderColor: color.border,
                    backgroundColor: color.bg,
                    fill: ds.label === 'Gesamt',
                    tension: 0.3,
                    pointRadius: 0,
                    borderWidth: ds.label === 'Gesamt' ? 2.5 : 1.5,
                    borderDash: ds.label === 'Gesamt' ? [] : [5, 3],
                };
            });

            const config = {
                type: 'line',
                data: {
                    labels: data.labels || [],
                    datasets: datasets,
                },
                options: {
                    ...CHART_DEFAULTS,
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            ticks: {
                                ...CHART_DEFAULTS.scales.y.ticks,
                                stepSize: 1,
                                callback: function(val) {
                                    return Number.isInteger(val) ? val : '';
                                },
                            },
                        },
                    },
                },
            };

            playerChart = createOrUpdateChart(playerChart, 'playerChart', 'playerChartEmpty', config);
        } catch (err) {
            console.error('Fehler beim Laden der Spieler-Daten:', err);
        }
    }

    // --- Disk-Chart ---
    async function loadDiskChart() {
        try {
            const resp = await fetch('/api/analytics/system?period=' + currentPeriod);
            if (!resp.ok) return;
            const data = await resp.json();

            const config = {
                type: 'line',
                data: {
                    labels: data.labels || [],
                    datasets: [
                        {
                            label: 'Disk %',
                            data: data.datasets?.[2]?.data || [],
                            borderColor: COLORS.disk.border,
                            backgroundColor: COLORS.disk.bg,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                    ],
                },
                options: {
                    ...CHART_DEFAULTS,
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            max: 100,
                            ticks: {
                                ...CHART_DEFAULTS.scales.y.ticks,
                                callback: function(val) { return val + '%'; },
                            },
                        },
                    },
                },
            };

            diskChart = createOrUpdateChart(diskChart, 'diskChart', 'diskChartEmpty', config);
        } catch (err) {
            console.error('Fehler beim Laden der Disk-Daten:', err);
        }
    }

    // --- Uptime-Chart ---
    async function loadUptimeChart() {
        try {
            const resp = await fetch('/api/analytics/summary');
            if (!resp.ok) return;
            const summary = await resp.json();

            const uptimeData = summary.server_uptime_24h || {};
            const serverNames = Object.keys(uptimeData);

            if (serverNames.length === 0) {
                // Keine Server-Daten vorhanden
                const canvas = document.getElementById('uptimeChart');
                const emptyDiv = document.getElementById('uptimeChartEmpty');
                if (canvas) canvas.style.display = 'none';
                if (emptyDiv) emptyDiv.style.display = 'block';
                if (uptimeChart) { uptimeChart.destroy(); uptimeChart = null; }
                return;
            }

            const uptimeValues = serverNames.map(function(s) { return uptimeData[s]; });
            const downtimeValues = serverNames.map(function(s) { return Math.max(0, 100 - uptimeData[s]); });

            const config = {
                type: 'bar',
                data: {
                    labels: serverNames.map(function(s) {
                        return s.charAt(0).toUpperCase() + s.slice(1);
                    }),
                    datasets: [
                        {
                            label: 'Online %',
                            data: uptimeValues,
                            backgroundColor: COLORS.uptime.bg,
                            borderColor: COLORS.uptime.border,
                            borderWidth: 1,
                            borderRadius: 4,
                        },
                        {
                            label: 'Offline %',
                            data: downtimeValues,
                            backgroundColor: COLORS.downtime.bg,
                            borderColor: COLORS.downtime.border,
                            borderWidth: 1,
                            borderRadius: 4,
                        },
                    ],
                },
                options: {
                    ...CHART_DEFAULTS,
                    plugins: {
                        ...CHART_DEFAULTS.plugins,
                        tooltip: {
                            ...CHART_DEFAULTS.plugins.tooltip,
                            callbacks: {
                                label: function(ctx) {
                                    return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%';
                                },
                            },
                        },
                    },
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        x: {
                            ...CHART_DEFAULTS.scales.x,
                            stacked: true,
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            stacked: true,
                            max: 100,
                            ticks: {
                                ...CHART_DEFAULTS.scales.y.ticks,
                                callback: function(val) { return val + '%'; },
                            },
                        },
                    },
                },
            };

            uptimeChart = createOrUpdateChart(uptimeChart, 'uptimeChart', 'uptimeChartEmpty', config);
        } catch (err) {
            console.error('Fehler beim Laden der Uptime-Daten:', err);
        }
    }

    // --- Summary-Bereich aktualisieren ---
    async function loadSummary() {
        try {
            const resp = await fetch('/api/analytics/summary');
            if (!resp.ok) return;
            const data = await resp.json();

            const container = document.getElementById('analyticsSummary');
            if (!container) return;

            container.innerHTML =
                '<div class="stat-item">' +
                    '<span class="stat-value">' + (data.peak_players_24h || 0) + '</span>' +
                    '<span class="stat-label">Spieler-Peak (24h)</span>' +
                '</div>' +
                '<div class="stat-item">' +
                    '<span class="stat-value">' + (data.avg_cpu_24h || 0) + '%</span>' +
                    '<span class="stat-label">CPU Avg (24h)</span>' +
                '</div>' +
                '<div class="stat-item">' +
                    '<span class="stat-value">' + (data.avg_ram_24h || 0) + '%</span>' +
                    '<span class="stat-label">RAM Avg (24h)</span>' +
                '</div>' +
                '<div class="stat-item">' +
                    '<span class="stat-value">' + (data.total_entries || 0) + '</span>' +
                    '<span class="stat-label">Datenpunkte</span>' +
                '</div>';
        } catch (err) {
            console.error('Fehler beim Laden der Zusammenfassung:', err);
        }
    }

    // --- Alle Charts laden ---
    function loadAllCharts() {
        loadPerfChart();
        loadPlayerChart();
        loadDiskChart();
        loadUptimeChart();
        loadSummary();
    }

    // --- Zeitraum wechseln ---
    window.setPeriod = function(period) {
        currentPeriod = period;

        // Button-Zustand aktualisieren
        var buttons = document.querySelectorAll('.btn-period');
        buttons.forEach(function(btn) {
            btn.classList.remove('active');
            if (btn.getAttribute('data-period') === period) {
                btn.classList.add('active');
            }
        });

        // Charts neu laden
        loadAllCharts();
    };

    // --- Initiales Laden ---
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadAllCharts);
    } else {
        loadAllCharts();
    }

    // --- Automatische Aktualisierung alle 5 Minuten ---
    setInterval(loadAllCharts, 5 * 60 * 1000);

})();
</script>
