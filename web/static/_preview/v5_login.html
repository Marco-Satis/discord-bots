<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ request.state.csrf_token|default('') }}">
  <title>Bot Control — Anmelden</title>
  <link rel="stylesheet" href="/static/fonts/geist/geist.css">
  <link rel="stylesheet" href="/static/tailwind/output.css">
  <link rel="stylesheet" href="/static/tailwind/_tokens.css">
  <link rel="stylesheet" href="/static/_preview/v5.css">
  <style>
    /* Midnight-Navy Login — flacher Navy-BG + EIN dezenter blauer Glow hinter dem Orb (keine Kacheln) */
    body{ background:var(--s0) }
    body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:radial-gradient(820px 520px at 50% 16%, rgba(59,130,246,.16), transparent 62%) }
    .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1 }
    .login-card{ width:100%; max-width:420px; text-align:center }
    .orb-stage{ position:relative; height:190px; display:flex; align-items:center; justify-content:center; margin-bottom:8px }
    .orb-glow{ position:absolute; width:300px; height:200px; border-radius:50%; z-index:0; pointer-events:none;
      background:radial-gradient(ellipse at center, #93c5fd 0%, rgba(59,130,246,.5) 35%, rgba(109,92,246,.16) 60%, transparent 75%);
      filter:blur(40px); opacity:.7; animation:obreath 6s ease-in-out infinite }
    @keyframes obreath{ 50%{ opacity:.95; transform:scale(1.06) } }
    .orb{ position:relative; z-index:1; width:96px; height:96px; border-radius:24px;
      display:flex; align-items:center; justify-content:center; font-weight:800; font-size:42px; color:#fff;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      background:linear-gradient(135deg,var(--acc),var(--acc-3));
      box-shadow:0 0 50px rgba(59,130,246,.55), inset 0 2px 0 rgba(255,255,255,.35) }
    .orb-grid{ position:absolute; inset:0; z-index:0; opacity:.5;
      background-image:radial-gradient(rgba(96,165,250,.45) 1px, transparent 1px);
      background-size:22px 22px;
      -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent 75%);
      mask-image:radial-gradient(closest-side, #000 30%, transparent 75%) }
    .login-eyebrow{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
      letter-spacing:.22em; text-transform:uppercase; color:var(--acc-2); margin-top:4px }
    .login-title{ font-size:23px; font-weight:600; letter-spacing:-.01em; margin:6px 0 0 }
    .login-sub{ color:var(--t2); font-size:14px; margin:7px 0 26px }
    .oauth{ display:flex; gap:12px; margin-bottom:22px }
    .oauth .btn{ flex:1; justify-content:center; padding:13px; font-weight:500 }
    .btn-discord{ border:0; color:#fff; background:linear-gradient(135deg,#5865f2,#6d5cf6);
      box-shadow:0 0 0 1px rgba(99,102,241,.4), 0 10px 28px rgba(88,101,242,.42) }
    .btn-discord:hover{ transform:translateY(-2px); box-shadow:0 0 0 1px rgba(99,102,241,.6), 0 16px 40px rgba(88,101,242,.55) }
    .divider{ display:flex; align-items:center; gap:12px; color:var(--t3); font-size:11.5px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; margin:6px 0 18px }
    .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line) }
    .field{ width:100%; padding:13px 15px; border-radius:10px; border:1px solid var(--line);
      background:var(--s2); color:var(--t1); font-size:14px; font-family:inherit; margin-bottom:12px;
      transition:border-color var(--fast), box-shadow var(--fast) }
    .field::placeholder{ color:var(--t3) }
    .field:focus{ outline:0; border-color:var(--line-accent); box-shadow:0 0 0 3px var(--acc-soft) }
    .btn-cont{ width:100%; justify-content:center; padding:14px; font-weight:600; font-size:15px }
    .login-foot{ margin-top:30px; display:flex; gap:18px; justify-content:center; font-size:13px }
    .login-foot a{ color:var(--t3); text-decoration:none } .login-foot a:hover{ color:var(--t1) }
    .copyr{ color:var(--t3); font-size:12px; margin-top:14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .backlink{ position:fixed; top:20px; left:24px; z-index:2; color:var(--t2); text-decoration:none;
      font-size:14px; display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--s1) }
    .backlink:hover{ color:#fff; border-color:var(--line-accent) }
  </style>
</head>
<body>
  <a class="backlink" href="/static/_preview/v5_landing.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Zurück
  </a>

  <div class="login-wrap">
    <div class="login-card">
      <div class="orb-stage">
        <div class="orb-glow"></div>
        <div class="orb-grid"></div>
        <div class="orb">B</div>
      </div>
      <div class="login-eyebrow">// System Access</div>
      <h1 class="login-title">Willkommen zurück</h1>
      <p class="login-sub">Melde dich an, um dein Bot-Control-Center zu öffnen.</p>

      <div class="oauth">
        <a class="btn btn-discord" href="/static/_preview/v5_dashboard.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0015.4 3l-.2.5c1.7.4 2.5.9 3.4 1.5a13.3 13.3 0 00-11.2 0c.9-.6 1.9-1.1 3.4-1.5L10.6 3a19.8 19.8 0 00-4.9 1.4C2.6 9 1.8 13.5 2.2 17.9a19.9 19.9 0 006 3l.4-.6c-1-.3-1.8-.7-2.6-1.2l.6-.4a14.2 14.2 0 0012.8 0l.6.4c-.8.5-1.6.9-2.6 1.2l.4.6a19.9 19.9 0 006-3c.5-5.1-.8-9.6-3.5-13.5zM9 15.3c-1 0-1.7-.9-1.7-2s.8-2 1.7-2 1.7.9 1.7 2-.8 2-1.7 2zm6 0c-1 0-1.7-.9-1.7-2s.8-2 1.7-2 1.7.9 1.7 2-.8 2-1.7 2z"/></svg>
          Mit Discord anmelden
        </a>
      </div>

      <div class="divider">oder Notfall-Login</div>

      <form action="/static/_preview/v5_dashboard.html" method="get">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token|default('') }}">
        <input class="field" type="text" name="username" placeholder="Benutzername" autocomplete="username">
        <input class="field" type="password" name="password" placeholder="Passwort" autocomplete="current-password">
        <a class="btn btn--primary btn-cont" href="/static/_preview/v5_dashboard.html">Anmelden</a>
      </form>

      <div class="login-foot">
        <a href="#">Discord</a><a href="#">Status</a><a href="#">Docs</a><a href="#">Datenschutz</a>
      </div>
      <div class="copyr">Ostfront Sammelpunkt · Bot Control · lokal & DSGVO-konform</div>
    </div>
  </div>
</body>
</html>
